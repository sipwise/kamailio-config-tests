    contacts:
      - email: "customer.test@spce.test"
        reseller_id: 1
    details:
      status: 'active'
      type: 'sipaccount'
      billing_profile_id: 1
      reseller_id: 1
subscribers:
  invite-caller-rbt-stop-on-ingress-silent.scenarios-rbt.test:
    testuser1002:
      customer: 'customer.test'
      password: testuser
      cc: 43
      ac: 1
      sn: 1002
    testuser1003:
      customer: 'customer.test'
