---
test_uuid: invite_caller_rbt_stop_on_ingress_silent
description: >-
  The callee has a pre-call announcement, after which the emulated ringback tone of the
  caller applies. The callee answers with 183 with SDP, but never sends any media, and the
  caller cancels the call. With emulated_rbt_stop_on_ingress the ringback tone is played
  on the 183 with SDP, and it is played until the call is cancelled.
domains:
  invite-caller-rbt-stop-on-ingress-silent.scenarios-rbt.test:
    reseller_id: 1
customers:
