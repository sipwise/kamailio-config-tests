---
test_uuid: invite_caller_rbt_no_stop_on_ingress
description: >-
  The callee has a pre-call announcement, after which the emulated ringback tone of the
  caller applies. The callee answers with 183 with SDP, but never sends any media, and the
  caller cancels the call. Without emulated_rbt_stop_on_ingress no ringback tone is played
  on the 183 with SDP, so the caller gets no media after the announcement.
domains:
  invite-caller-rbt-no-stop-on-ingress.scenarios-rbt.test:
    reseller_id: 1
customers:
  'customer.test':
    contacts:
      - email: "customer.test@spce.test"
        reseller_id: 1
    details:
      status: 'active'
      type: 'sipaccount'
      billing_profile_id: 1
      reseller_id: 1
subscribers:
  invite-caller-rbt-no-stop-on-ingress.scenarios-rbt.test:
    testuser1002:
      customer: 'customer.test'
      password: testuser
      cc: 43
      ac: 1
      sn: 1002
    testuser1003:
      customer: 'customer.test'
      password: testuser
      cc: 43
      ac: 1
      sn: 1003
scenarios:
  - ip: 127.126.0.1
    username: testuser1002
    domain: invite-caller-rbt-no-stop-on-ingress.scenarios-rbt.test
    rtp_check:
      # the pre-call announcement only
      streams: 1
      min_packets: 10
    responders:
      - ip: 127.1.0.1
        username: testuser1003
        domain: invite-caller-rbt-no-stop-on-ingress.scenarios-rbt.test
        register: 'yes'
        rtp_check:
          streams: 0
