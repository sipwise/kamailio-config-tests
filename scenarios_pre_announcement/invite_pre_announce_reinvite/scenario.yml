---
test_uuid: invite_pre_announce_reinvite
description: >-
  The pre-announcement (DSM) answers with 183, then finishes with 301. The callee
  redirects the call with 302 and the redirect target answers via the CF loop, where
  the rtpengine From-tag is faked. The caller then re-INVITEs: the faked From-tag must
  not be used for the re-INVITE answer, otherwise rtcp-mux leaks to the caller.
