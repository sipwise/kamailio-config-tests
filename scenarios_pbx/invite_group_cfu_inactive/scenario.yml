# Call to a hunt group whose only member has a CFU that is not active right now
# (see callforward.yml.tt2). The member must be called normally.
# Requires kamailio.proxy.pbx.ignore_cf_when_hunting = no (the default), otherwise
# the CFU of the member is dropped before it is ever evaluated.
test_uuid: invite_group_cfu_inactive
domains:
  'invite-group-cfu-inactive.scenarios-pbx.test':
    reseller_id: 1
customers:
  'invite_group_cfu_inactive.customerpbx.test':
    contacts:
      - email: "invite_group_cfu_inactive.customerpbx.test@spce.test"
        reseller_id: 1
    details:
      status: 'active'
      type: 'pbxaccount'
      billing_profile_id: 1
      reseller_id: 1
subscribers:
  invite-group-cfu-inactive.scenarios-pbx.test:
    testgroup1010:
      customer: 'invite_group_cfu_inactive.customerpbx.test'
      password: testgroup
      cc: 43
      ac: 1
      sn: 1010
      is_pbx_group: 1
      pbx_hunt_policy: serial
      pbx_hunt_timeout: 5
      pbx_extension: 1010
    testuser1002:
      customer: 'invite_group_cfu_inactive.customerpbx.test'
      password: testuser
      cc: 43
      ac: 1
      sn: 1002
      is_pbx_pilot: 1
      pbx_extension: 1002
    testuser1003:
      customer: 'invite_group_cfu_inactive.customerpbx.test'
      password: testuser
      cc: 43
      ac: 1
      sn: 1003
      is_pbx_pilot: 0
      pbx_extension: 1003
      pbx_groups: [testgroup1010]
    testuser1005:
      customer: 'invite_group_cfu_inactive.customerpbx.test'
      password: testuser
      cc: 43
      ac: 1
      sn: 1005
      is_pbx_pilot: 0
      pbx_extension: 1005
scenarios:
  - ip: 127.126.0.1
    username: testuser1002
    domain: invite-group-cfu-inactive.scenarios-pbx.test
    responders:
      - ip: 127.1.0.1
        username: testgroup1010
        domain: invite-group-cfu-inactive.scenarios-pbx.test
        register: no
      - ip: 127.1.0.2
        username: testuser1003
        domain: invite-group-cfu-inactive.scenarios-pbx.test
        register: yes
